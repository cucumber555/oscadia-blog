<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1769ff"><meta name="description" content="OSCADIA Blog">
<title>OSCADIA Blog</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">OSCADIA <span>Blog</span></a>
  <nav><a href="/">홈</a><button id="writeNav" class="link-button">글쓰기</button><a id="myProfile" href="#" hidden>내 프로필</a></nav>
  <div class="account"><span id="userLabel">로그아웃 상태</span><button id="authButton" class="primary">로그인</button></div>
</header>
<main class="layout">
  <section id="notice" class="notice" hidden></section>
  <section id="authPanel" class="panel" hidden>
    <h1>OSCADIA 계정으로 로그인</h1><p class="muted">기존 OSCADIA와 같은 Supabase Auth 계정을 사용합니다.</p>
    <label>이메일<input id="email" type="email" autocomplete="email" placeholder="name@oscadia.net"></label>
    <label>비밀번호<input id="password" type="password" autocomplete="current-password"></label>
    <div class="actions"><button id="signIn" class="primary">로그인</button><button id="signUp" class="secondary">회원가입</button><button id="cancelAuth" class="quiet">취소</button></div>
  </section>
  <section id="composer" class="panel" hidden>
    <h1>새 게시글</h1>
    <label>제목<input id="postTitle" maxlength="180" placeholder="제목을 입력하세요"></label>
    <div class="editor-tools"><button id="insertLink" class="secondary">URL 삽입</button><button id="insertMedia" class="secondary">사진·동영상·파일 삽입</button><input id="mediaFiles" type="file" multiple accept="image/*,video/*,.pdf,.txt,.csv,.zip,.doc,.docx,.ppt,.pptx,.xls,.xlsx" hidden></div>
    <label>본문<textarea id="postBody" rows="10" maxlength="30000" placeholder="원하는 위치에 커서를 놓고 URL 또는 미디어를 삽입하세요."></textarea></label>
    <p class="small muted">업로드 파일은 파일당 최대 50MB입니다. 게시글과 첨부 파일은 공개됩니다.</p>
    <div id="selectedFiles" class="small muted"></div><div id="uploadStatus" class="small muted"></div>
    <div class="actions"><button id="publish" class="primary">게시하기</button><button id="cancelWrite" class="quiet">취소</button></div>
  </section>
  <section id="profilePanel" class="panel" hidden></section>
  <section id="postPanel" class="panel" hidden></section>
  <section id="feedPanel">
    <div class="feed-heading"><div><p class="eyebrow">PUBLIC STORIES</p><h1>OSCADIA Blog</h1><p class="muted">누구나 읽고, 회원은 팔로우하고 함께 참여할 수 있습니다.</p></div><button id="heroWrite" class="primary">글쓰기</button></div>
    <div class="search-row"><input id="search" placeholder="게시글 검색"><button id="searchBtn" class="secondary">검색</button></div>
    <div id="feed" class="feed"><div class="loading">게시글을 불러오는 중…</div></div>
  </section>
  <footer>OSCADIA Blog <span>·</span> A place to share ideas</footer>
</main>
<script src="app.js"></script>
</body></html>
